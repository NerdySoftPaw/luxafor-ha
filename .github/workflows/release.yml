name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create zip
        run: |
          cd custom_components
          zip -r ../luxafor.zip luxafor/

      - uses: softprops/action-gh-release@v2
        with:
          files: luxafor.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
