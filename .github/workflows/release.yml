name: Release

on:
  push:
    tags:
      - "20[0-9][0-9].[0-9]*b[0-9]*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create zip
        run: |
          cd custom_components/luxafor
          zip -r ../../luxafor.zip .

      - uses: softprops/action-gh-release@v2
        with:
          files: luxafor.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
